<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperTradingView</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/drawings.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- Logomark: ascending bars + trend arrow -->
      <svg class="brand-logo" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="brand-grad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#26a69a"/>
            <stop offset="100%" stop-color="#4f8cff"/>
          </linearGradient>
        </defs>
        <rect x="2"  y="27" width="6" height="7"  rx="1.5" fill="url(#brand-grad)" opacity="0.40"/>
        <rect x="10" y="21" width="6" height="13" rx="1.5" fill="url(#brand-grad)" opacity="0.60"/>
        <rect x="19" y="14" width="6" height="20" rx="1.5" fill="url(#brand-grad)" opacity="0.80"/>
        <rect x="28" y="6"  width="6" height="28" rx="1.5" fill="url(#brand-grad)"/>
        <polyline points="5,27 13,21 22,14 31,6"
          stroke="url(#brand-grad)" stroke-width="2.2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="27,3 31,6 34,10"
          stroke="url(#brand-grad)" stroke-width="2.2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <!-- Wordmark: Super (light) · Trading (bold) · View (accent) -->
      <span class="brand-name">
        <span class="brand-super">Super</span><span class="brand-trading">Trading</span><span class="brand-view">View</span>
      </span>
    </div>

    <!-- Visual grid-layout switcher (replaces plain <select>) -->
    <div class="layout-switcher" id="layout-switcher" role="group" aria-label="Chart layout">
      <button class="layout-btn" data-count="1" title="Single chart" type="button">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <rect x="1" y="1" width="14" height="10" rx="1.5"/>
        </svg>
      </button>
      <button class="layout-btn" data-count="2" title="2 charts" type="button">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <rect x="1" y="1" width="6" height="10" rx="1.5"/>
          <rect x="9" y="1" width="6" height="10" rx="1.5"/>
        </svg>
      </button>
      <button class="layout-btn" data-count="4" title="4 charts" type="button">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <rect x="1" y="1" width="6" height="4" rx="1"/>
          <rect x="9" y="1" width="6" height="4" rx="1"/>
          <rect x="1" y="7" width="6" height="4" rx="1"/>
          <rect x="9" y="7" width="6" height="4" rx="1"/>
        </svg>
      </button>
      <button class="layout-btn" data-count="6" title="6 charts" type="button">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <rect x="1"    y="1" width="3.5" height="4" rx="0.8"/>
          <rect x="6.25" y="1" width="3.5" height="4" rx="0.8"/>
          <rect x="11.5" y="1" width="3.5" height="4" rx="0.8"/>
          <rect x="1"    y="7" width="3.5" height="4" rx="0.8"/>
          <rect x="6.25" y="7" width="3.5" height="4" rx="0.8"/>
          <rect x="11.5" y="7" width="3.5" height="4" rx="0.8"/>
        </svg>
      </button>
      <button class="layout-btn" data-count="8" title="8 charts" type="button">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <rect x="1"    y="1" width="2.5" height="4" rx="0.6"/>
          <rect x="4.5"  y="1" width="2.5" height="4" rx="0.6"/>
          <rect x="8"    y="1" width="2.5" height="4" rx="0.6"/>
          <rect x="11.5" y="1" width="2.5" height="4" rx="0.6"/>
          <rect x="1"    y="7" width="2.5" height="4" rx="0.6"/>
          <rect x="4.5"  y="7" width="2.5" height="4" rx="0.6"/>
          <rect x="8"    y="7" width="2.5" height="4" rx="0.6"/>
          <rect x="11.5" y="7" width="2.5" height="4" rx="0.6"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="workspace">
    <aside class="rail rail-left" id="rail-left">
      <!-- Cards added in Task 8 (Narratives), Task 10 (Events), Task 12 (Factor Pulse) -->
    </aside>
    <div class="grid" id="grid"></div>
    <aside class="rail rail-right" id="rail-right">
      <!-- Cards added in Task 14 (AI Insight), Task 13 (Live Signals), Task 9 (News Tape) -->
    </aside>
  </main>
  <footer class="bottom-dock" id="bottom-dock">
    <!-- Populated in Task 15 -->
  </footer>

  <datalist id="symbols-datalist"></datalist>

  <!-- Pane template — cloned for each chart slot -->
  <template id="pane-template">
    <section class="pane">
      <div class="pane-header">
        <input class="symbol-input" list="symbols-datalist" placeholder="Symbol…" spellcheck="false" autocomplete="off" />

        <!-- Timeframe pill buttons (populated by JS from SYMBOLS.timeframes) -->
        <div class="tf-pills" role="group" aria-label="Timeframe"></div>

        <!-- Indicators button — shows active count badge when non-zero -->
        <button class="fx-btn" type="button" title="Indicators (I)">
          <span class="fx-icon">ƒx</span>
          <span class="fx-count" aria-label="active indicators"></span>
        </button>

        <button class="ph-draw-toggle" type="button" data-action="draw-toggle" title="Drawing tools">✏</button>

        <div class="pane-divider"></div>

        <div class="ticker">
          <span class="ticker-dot" aria-hidden="true"></span>
          <span class="ticker-price">—</span>
          <span class="ticker-change"></span>
        </div>
        <span class="status-badge" hidden></span>
      </div>
      <div class="pane-body">
        <div class="draw-toolbar">
          <button class="draw-tool active" type="button" data-tool="cursor" title="Select">⤤</button>
          <div class="draw-tool-sep"></div>
          <button class="draw-tool" type="button" data-tool="trendline" title="Trendline">╱</button>
          <button class="draw-tool" type="button" data-tool="horizontal" title="Horizontal line">─</button>
          <button class="draw-tool" type="button" data-tool="vertical" title="Vertical line">│</button>
          <button class="draw-tool" type="button" data-tool="rectangle" title="Rectangle">▭</button>
          <button class="draw-tool" type="button" data-tool="fib" title="Fibonacci">⌘</button>
          <button class="draw-tool" type="button" data-tool="channel" title="Parallel channel">∥</button>
          <button class="draw-tool" type="button" data-tool="arc" title="Arc">◠</button>
          <button class="draw-tool" type="button" data-tool="ruler" title="Measurement ruler">📏</button>
          <button class="draw-tool" type="button" data-tool="text" title="Text">T</button>
          <div class="draw-tool-sep"></div>
          <button class="draw-tool" type="button" data-action="undo" title="Undo (Ctrl+Z)">↺</button>
          <button class="draw-tool" type="button" data-action="erase" title="Erase all">×</button>
          <div class="draw-tool-sep"></div>
          <button class="draw-tool" type="button" data-action="settings" title="Drawing settings">⚙</button>
        </div>
        <div class="draw-floating-palette" hidden></div>
        <div class="chart"></div>
      </div>
    </section>
  </template>

  <!-- Indicators modal -->
  <div id="indicators-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">Indicators</span>
        <span class="modal-sub"></span>
        <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      </div>

      <!-- Live search — filters the list below -->
      <div class="modal-search-wrap">
        <svg class="modal-search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="5.5" cy="5.5" r="4"/>
          <line x1="9" y1="9" x2="13" y2="13"/>
        </svg>
        <input type="text" id="indicators-search" class="modal-search"
               placeholder="Search indicators…" autocomplete="off" spellcheck="false" />
      </div>

      <div class="modal-body" id="indicators-list"></div>

      <div class="modal-footer">
        <button class="btn-primary" type="button" data-close>Done</button>
      </div>
    </div>
  </div>

  <div id="draw-style-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" style="width: min(360px, 92vw); max-height: 70vh;">
      <div class="modal-header">
        <span class="modal-title">Drawing style</span>
        <span class="modal-sub" id="dsm-sub"></span>
        <button class="modal-close" type="button" data-close>×</button>
      </div>
      <div class="modal-body" id="dsm-body"></div>
      <div class="modal-footer">
        <button id="dsm-delete" type="button" class="btn-danger">Delete</button>
        <div>
          <button type="button" class="btn-secondary" data-close>Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/indicators.js"></script>
  <script src="/static/drawings.js"></script>
  <script src="/static/app.js"></script>

  <div id="draw-settings-pop" class="draw-settings-pop" hidden>
    <div class="dsp-header">Drawing settings</div>
    <div class="dsp-row">
      <span class="dsp-lbl">Toolbar</span>
      <div class="dsp-pill-row">
        <button class="dsp-pill" type="button" data-pref-toolbar="left">Left edge</button>
        <button class="dsp-pill" type="button" data-pref-toolbar="floating">Floating</button>
      </div>
    </div>
    <div class="dsp-row">
      <span class="dsp-lbl">Snap to OHLC</span>
      <div class="dsp-pill-row">
        <button class="dsp-pill" type="button" data-pref-snap="shift">Shift held</button>
        <button class="dsp-pill" type="button" data-pref-snap="always">Always</button>
        <button class="dsp-pill" type="button" data-pref-snap="never">Never</button>
      </div>
    </div>
    <div class="dsp-row">
      <span class="dsp-lbl">Undo depth</span>
      <input type="number" id="dsp-undo" min="1" max="500" step="1" class="dsm-num" style="width:64px;">
    </div>
  </div>
</body>
</html>
