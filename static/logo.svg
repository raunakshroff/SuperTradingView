<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <!-- 4 ascending bars -->
  <rect x="2"  y="27" width="6" height="7"  rx="1.5" fill="url(#g)" opacity="0.40"/>
  <rect x="10" y="21" width="6" height="13" rx="1.5" fill="url(#g)" opacity="0.60"/>
  <rect x="19" y="14" width="6" height="20" rx="1.5" fill="url(#g)" opacity="0.80"/>
  <rect x="28" y="6"  width="6" height="28" rx="1.5" fill="url(#g)"/>
  <!-- Trend line -->
  <polyline points="5,27 13,21 22,14 31,6"
    stroke="url(#g)" stroke-width="2.2" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow tip -->
  <polyline points="27,3 31,6 34,10"
    stroke="url(#g)" stroke-width="2.2" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
